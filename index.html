
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotoğraf Seçici</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-xl w-full bg-white border border-slate-200/80 rounded-3xl p-8 shadow-xl shadow-slate-200/50 space-y-6">
    
    <div class="text-center space-y-2">
      <div class="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-semibold">
        ✨ Yapay Zeka Destekli
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Fotoğraf Seçici</h1>
      <p class="text-slate-500 text-sm">Fotoğraflarını yükle, yapay zeka en başarılı olanı seçsin.</p>
    </div>

    <form id="uploadForm" class="space-y-5">
      <div class="border-2 border-dashed border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/30 rounded-2xl p-8 text-center cursor-pointer transition-all duration-200 flex flex-col items-center justify-center bg-slate-50/50 group" onclick="document.getElementById('fileInput').click()">
        <div class="w-12 h-12 bg-white rounded-xl shadow-sm border border-slate-100 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
          <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        <span class="text-slate-700 font-semibold text-sm">Fotoğrafları Seç</span>
        <span class="text-xs text-slate-400 mt-1">Birden fazla görsel yükleyebilirsin</span>
        <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="updateFileCount()">
      </div>

      <div id="fileCount" class="text-xs text-indigo-600 text-center font-medium min-h-[16px]"></div>

      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl transition duration-200 shadow-md shadow-indigo-100 disabled:opacity-50">
        Analiz Et
      </button>
    </form>

    <div id="loading" class="hidden text-center space-y-3 py-6">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-3 border-indigo-600 border-t-transparent"></div>
      <p id="loadingStatus" class="text-sm text-slate-500 font-medium">Fotoğraflar hazırlanıyor ve inceleniyor...</p>
    </div>

    <div id="resultBox" class="hidden bg-slate-50 border border-slate-200/60 rounded-2xl p-6 space-y-3">
      <h2 class="text-base font-bold text-slate-900 border-b border-slate-200/80 pb-2 flex items-center gap-2">
        <span>🤖</span> Analiz Sonucu
      </h2>
      <div id="resultContent" class="text-slate-600 text-sm whitespace-pre-line leading-relaxed"></div>
    </div>

  </div>

  <script>
    function updateFileCount() {
      const input = document.getElementById('fileInput');
      const countDiv = document.getElementById('fileCount');
      countDiv.innerText = input.files.length > 0 ? `${input.files.length} adet fotoğraf seçildi` : '';
    }

    // Telefon fotoğraflarını Vercel limitine takılmaması için tarayıcıda küçülten fonksiyon
    function compressImage(file, maxWidth = 1280, quality = 0.8) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({
              base64: dataUrl.split(',')[1],
              mimeType: 'image/jpeg'
            });
          };
        };
      });
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('fileInput');
      if (fileInput.files.length === 0) return alert('Lütfen fotoğraf seç!');

      const btn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const resultBox = document.getElementById('resultBox');
      const resultContent = document.getElementById('resultContent');

      btn.disabled = true;
      loading.classList.remove('hidden');
      resultBox.classList.add('hidden');

      try {
        const compressedImages = [];
        for (let file of fileInput.files) {
          const compressed = await compressImage(file);
          compressedImages.push(compressed);
        }

        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ images: compressedImages })
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          alert('Hata: ' + (data.error || 'Bilinmeyen sunucu hatası'));
        } else {
          resultContent.innerText = data.analysis;
          resultBox.classList.remove('hidden');
        }
      } catch (err) {
        alert('Bağlantı hatası: ' + err.message);
      } finally {
        btn.disabled = false;
        loading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
